services:
  telemetry:
    image: text-to-design-telemetry:local
    build:
      context: .
      dockerfile: packages/telemetry/Dockerfile
    init: true
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text_to_design
      PORT: 8787
    ports:
      - '127.0.0.1:5433:5432'
      - '127.0.0.1:8787:8787'
    volumes:
      - tdd-pg-data:/var/lib/postgresql/data
    stop_grace_period: 60s

volumes:
  tdd-pg-data:
