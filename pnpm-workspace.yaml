packages:
  - packages/*
allowBuilds:
  lefthook: true
  esbuild: true
# 跨包共享的公共依赖,各 package.json 用 "catalog:" 引用,版本在此统一维护
catalog:
  zod: ^4.6.7
  typescript: ^7.0.2
  '@types/node': ^26.6.6
  vite: ^8.3.8
  concurrently: 10.0.7
  vitest: ^5.1.1
  solid-js: ^2.0.3
  '@solidjs/web': ^2.0.3
  '@solidjs/vite-plugin': ^3.0.1
  '@lucide/solid': ^1.78.0
minimumReleaseAgeExclude:
  - daisyui@5.7.46
  - '@lucide/solid@1.78.0'
