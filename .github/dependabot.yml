# 依赖与 action 的版本更新。仓库用 Conventional Commits + commitlint,
# 所以 dependabot 的提交标题必须已经是规范格式,否则本地 rebase / 合并时会被 hook 顶回来。
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      # 一组一条 PR:action 升级基本只改 pin 的版本号,拆开发只会刷屏
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    # 根 package.json + pnpm-workspace.yaml 覆盖 packages/*,只在根声明一次
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # 分两组而不是一组:major 要逐个看 breaking change,minor/patch 可以批量过
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # 注意 catalog: 引用的版本写在 pnpm-workspace.yaml,Dependabot 改的是各包的
      # package.json —— 若某依赖已在 catalog 里,升级后要人工把 catalog 那行一起改,
      # 否则 pnpm install 会因版本不一致报错。看到这类 PR 别直接 merge。
