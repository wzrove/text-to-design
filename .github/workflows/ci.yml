# PR 门禁。检查步骤全在 verify.yml(与发版共用同一份,不复制)。
#
# 为什么这里不挂 push:[main]:
#   主干 push 由 release.yml 触发,它自己会先调 verify.yml 再发布 —— 两边都挂 push
#   等于每次合入跑两遍同样的校验。主干依然被校验,只是校验的入口只有一处。
#   保留 workflow_dispatch 是为了能在任意 ref 上手跑一次。
name: ci

on:
  pull_request:
  workflow_dispatch:

# 同一条 PR 的新 push 顶掉旧 run:旧 run 的结论不该盖住新 run,也省一份机时
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
