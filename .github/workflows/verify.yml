# 复用型校验流水线:本文件不自己触发,只被 ci.yml(PR) 与 release.yml(主干 push) 调用。
#
# 拆出来的理由:此前校验步骤只在 ci.yml 里,release.yml 另起一条完全独立的流水线,
# 两条互不阻塞 —— 主干红了照样发版(见 docs/optimization-plan-2026-09-18.md §1)。
# 现在发版把 verify 当 needs,红的门禁挡住发布本身,而不是只挡住 PR。
name: verify

on:
  workflow_call:

# 根 package.json 的 postinstall 会跑 lefthook install;CI 装本地 hook 无意义
env:
  LEFTHOOK: "0"

jobs:
  quality:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset 反向门禁要 diff 到 base commit;默认 depth=1 时 base.sha 不在本地,
          # git diff 直接失败 → 门禁静默跳过。这是唯一需要历史的 job
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 格式与 lint
        run: pnpm lint
      - name: changeset 门禁
        # private 包(shared / website)会被 changesets 当 ignore;混进同一条 changeset 时
        # "Mixed changesets" 只在 release 的 version 阶段炸 —— 主干已合入时 PR 门禁拦不住
        # --against 是第二道:改了 shared/ 这类会被 bundle 进 dist 的代码却没写 changeset 时,
        # .changeset/ 是空的,光看它会直接放过(发版时 isPublished 判定版本未变 → 静默跳过)
        # 基线统一用「与主干的 ref」:PR 走 base.ref,push 走 default branch。
        # 不用 github.event.before —— 它在 workflow_call 下会落成被调 workflow 自己的 ref,
        # 且 push 事件里遇到同内容重推会与 HEAD 相同(diff 为空),门禁随即空转或错位。
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" 2>/dev/null || true
          pnpm chset:check --against "origin/${BASE_REF}"
      - name: 类型检查
        run: pnpm typecheck
      - name: 不变式测试
        run: pnpm test

  build:
    # 与 quality 并行:两边的失败原因不同(lint 挂 vs vite 挂),分开才知道该修哪边
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建(ui 三份产物 + mcp)
        run: pnpm build
