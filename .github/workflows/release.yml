name: release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 版本确认与 npm 升级
        run: |
          node --version
          npm --version
          npm install -g npm@11
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: 记录发布前已有 tag
        run: git tag > "${RUNNER_TEMP}/tags-before.txt"
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 推送版本 tag
        run: git push origin --tags
      - name: 为新 tag 创建 Release 并上传 dist 产物
        run: node scripts/release-assets.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS_BEFORE: ${{ runner.temp }}/tags-before.txt
          RELEASE_REPO: wzrove/text-to-design
