pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,tsx,mjs,cjs,json,jsonc}"
      run: pnpm exec biome check --write --unsafe   {staged_files}
    typecheck:
      run: pnpm typecheck
    test: 
      run: pnpm run test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "$1"
